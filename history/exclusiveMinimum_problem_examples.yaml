      description: 'Level of reasoning effort.

'
      type: string
      enum:
        - default
        - low
        - medium
        - high
      default: default
    compute_multiplier:
      description: 'Multiplier on amount of compute used for exploring search space during training.

'
      oneOf:
        - type: string
          enum:
            - auto
          x-stainless-const: true
        - type: number
          minimum: 1.0e-05
          maximum: 10
          exclusiveMinimum: true
      default: auto
    eval_interval:
      description: 'The number of training steps between evaluation runs.

'
      oneOf:
        - type: string
          enum:
            - auto
          x-stainless-const: true
        - type: integer
          minimum: 1
      default: auto
    eval_samples:
      description: 'Number of evaluation samples to generate per training step.

'
      oneOf:
        - type: string
          enum:
            - auto
          x-stainless-const: true
        - type: integer
          minimum: 1
      default: auto
